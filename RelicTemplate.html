<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Relic Details | Relics of the Cosmos</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background: #0b1426;
            color: white;
            font-family: Arial, sans-serif;
            line-height: 1.7;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        #hero-title {
            font-size: clamp(2rem, 5vw, 3rem);
            text-align: center;
            margin-bottom: 10px;
        }

        #hero-subtitle {
            text-align: center;
            color: #a7b8d1;
            font-size: 1.2rem;
            font-weight: normal;
        }

        #relic-img {
            display: block;
            max-width: 100%;
            max-height: 500px;
            width: auto;
            height: auto;
            margin: 30px auto;
            border-radius: 12px;
        }

        #relic-img[hidden] {
            display: none;
        }

        #relic-caption {
            color: #a7b8d1;
            text-align: center;
            font-size: 0.9rem;
        }

        #specs-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit, minmax(190px, 1fr)
            );
            gap: 15px;
            margin: 40px 0;
        }

        .spec-card {
            background: #17233d;
            padding: 20px;
            border-radius: 10px;
        }

        .spec-card strong {
            color: #38bdf8;
        }

        .back-button {
    position: fixed;
    top: 25px;
    left: 30px;
    z-index: 1000;

    display: inline-block;
    padding: 12px 20px;

    background-color: #17233d;
    color: #38bdf8;
    text-decoration: none;

    font-size: 16px;
    font-weight: bold;

    border: 1px solid #38bdf8;
    border-radius: 10px;

    transition: all 0.3s ease;
}

.back-button:hover {
    background-color: #38bdf8;
    color: #0b1426;
    transform: translateX(-5px);
}







        .story-section {
            background: #111d33;
            padding: 25px;
            margin: 25px 0;
            border-radius: 12px;
        }

        .story-section h2 {
            color: #38bdf8;
        }

        .did-you-know {
            background: #17365a;
            padding: 25px;
            border-radius: 12px;
            margin: 30px 0;
        }


#hero-tag {
    text-align: center;
    color: #38bdf8;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.spec-box {
    background: #17233d;
    padding: 20px;
    border-radius: 10px;
}

.spec-label {
    color: #38bdf8;
    font-weight: bold;
}

.spec-value {
    color: white;
    margin-top: 8px;
}

.article-section {
    background: #111d33;
    padding: 25px;
    margin: 25px 0;
    border-radius: 12px;
}

.article-section h2 {
    color: #38bdf8;
}

    </style>
</head>

<body>

    <a href="http://localhost:5500/HomePage.html" class="back-button">
    ← Back to Home
    </a>

    <main class="container">

        <p id="hero-tag"></p>

        <h1 id="hero-title">Loading relic...</h1>

        <h2 id="hero-subtitle"></h2>

        <img id="relic-img" alt="Relic image" hidden>

        <p id="relic-caption"></p>

        <div id="specs-grid"></div>

        <div id="story-container"></div>

    </main>


<script type="module">

    import { relicDatabase } from './relicDatabase.js';

    // Get the relic name from the URL
    const params = new URLSearchParams(
        window.location.search
    );

    const itemName = params.get('item');

    console.log("Requested relic:", itemName);

    // Look for the selected relic in the database
    const item = relicDatabase[itemName];

    if (item) {

        console.log("Relic found:", item.title);

        // Display all the information
        item.render();

    } else {

        document.getElementById('hero-title').textContent =
            'Relic not found';

        console.error("Could not find relic:", itemName);

    }

</script>
</body>
</html>
